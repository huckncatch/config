# Third-party files fetched by `chezmoi apply`, pinned to exact commits.
# To update one: replace its commit hash in the URL, then run chezmoi apply.
# exact = true removes files that are not in the archive (no stale leftovers).

# --- oh-my-zsh plugins ---
# Fetched into the repo's ZSH_CUSTOM (gitignored by name in /.gitignore)

["config/zsh/oh-my-zsh-custom/plugins/fast-syntax-highlighting"]
